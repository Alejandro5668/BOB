name: bob-asistente-voz

services:
  app:
    build: .
    image: bob-asistente-voz:latest
    ports:
      - "${BOB_HOST_PORT:-8501}:8501"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
      - ./cache/documentacion:/app/cache/documentacion
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
